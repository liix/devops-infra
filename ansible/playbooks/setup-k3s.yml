---
- name: Setup single-node k3s
  hosts: k3s_servers
  become: true
  tasks:
    - name: Install curl
      apt:
        name: curl
        state: present
        update_cache: true

    - name: Download k3s installer
      get_url:
        url: https://get.k3s.io
        dest: /tmp/install-k3s.sh
        mode: "0755"

    - name: Install k3s server
      command: /tmp/install-k3s.sh
      environment:
        INSTALL_K3S_EXEC: "server --tls-san {{ k3s_internal_ip }} --write-kubeconfig-mode 0644"
      args:
        creates: /usr/local/bin/k3s

    - name: Wait for k3s API
      wait_for:
        host: 127.0.0.1
        port: 6443
        delay: 5
        timeout: 180

    - name: Fetch k3s kubeconfig
      fetch:
        src: /etc/rancher/k3s/k3s.yaml
        dest: "{{ kubeconfig_local_path }}"
        flat: true

    - name: Point kubeconfig to the internal k3s address
      replace:
        path: "{{ kubeconfig_local_path }}"
        regexp: "https://127\\.0\\.0\\.1:6443"
        replace: "https://{{ k3s_internal_ip }}:6443"
      delegate_to: localhost
      become: false

    - name: Download helm
      get_url:
        url: https://get.helm.sh/helm-v4.3.0-linux-amd64.tar.gz
        dest: /tmp/helm-v4.3.0-linux-amd64.tar.gz
        mode: "0644"

    - name: Unpack helm
      unarchive:
        src: /tmp/helm-v4.3.0-linux-amd64.tar.gz
        dest: /tmp
        remote_src: true

    - name: Install helm
      copy:
        src: /tmp/linux-amd64/helm
        dest: /usr/local/bin/helm
        remote_src: true
        mode: "0755"

    - name: Copy monitoring values
      copy:
        src: "{{ playbook_dir }}/../../k8s/monitoring/values.yaml"
        dest: /tmp/monitoring-values.yaml
        mode: "0644"

    - name: Add Prometheus Helm repository
      command: helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
      register: helm_repo_add
      changed_when: "'has been added' in helm_repo_add.stdout"
      failed_when: helm_repo_add.rc != 0 and 'already exists' not in helm_repo_add.stderr

    - name: Update Prometheus Helm repository
      command: helm repo update prometheus-community

    - name: Install Prometheus and Grafana
      command: >
        helm upgrade --install monitoring prometheus-community/kube-prometheus-stack
        --version 86.2.0
        --namespace monitoring
        --create-namespace
        --values /tmp/monitoring-values.yaml
        --wait
        --timeout 10m
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
